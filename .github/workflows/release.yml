name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  # ── Native binaries ───────────────────────────────────────────────────────
  build-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x86-64
            binary: sdof_dynamics.exe
            asset: sdof_dynamics-windows-x86_64.exe

          - os: ubuntu-latest
            name: Linux x86-64
            binary: sdof_dynamics
            asset: sdof_dynamics-linux-x86_64

          - os: macos-latest
            name: macOS Apple Silicon
            binary: sdof_dynamics
            asset: sdof_dynamics-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-native-

      - name: Build
        run: cargo build --release --bin sdof_dynamics --features mathjax

      - name: Rename artifact
        shell: bash
        run: |
          cp target/release/${{ matrix.binary }} ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # ── WebAssembly ───────────────────────────────────────────────────────────
  build-wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-wasm-

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --bin sdof_dynamics_web

      - name: Install wasm-bindgen-cli
        run: |
          curl -L -o wb.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.114/wasm-bindgen-0.2.114-x86_64-unknown-linux-musl.tar.gz
          tar -xzf wb.tar.gz
          mv wasm-bindgen-0.2.114-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/

      - name: Package web bundle
        run: |
          mkdir -p _web
          wasm-bindgen --target web --out-dir _web \
            target/wasm32-unknown-unknown/release/sdof_dynamics_web.wasm
          cp web/index.html _web/index.html
          cd _web && zip -r ../sdof_dynamics-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: sdof_dynamics-web
          path: sdof_dynamics-web.zip

  # ── Publish Release ───────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SDOF Dynamics Explorer ${{ steps.version.outputs.tag }}"
          body: |
            ## Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** (x86-64) | `sdof_dynamics-windows-x86_64.exe` | LaTeX equations, no install needed |
            | **Linux** (x86-64) | `sdof_dynamics-linux-x86_64` | LaTeX equations |
            | **macOS** (Apple Silicon) | `sdof_dynamics-macos-aarch64` | LaTeX equations |
            | **Web** (all platforms) | `sdof_dynamics-web.zip` | WASM bundle, serve locally or deploy |

            ### Run the web bundle locally
            ```bash
            unzip sdof_dynamics-web.zip -d sdof_web
            cd sdof_web && python3 -m http.server 8000
            # open http://localhost:8000
            ```

            ### Linux / macOS
            ```bash
            chmod +x sdof_dynamics-linux-x86_64
            ./sdof_dynamics-linux-x86_64
            ```

            ---
            Live web version: https://iwes-luh.github.io/sdof_dynamics/
          files: |
            artifacts/sdof_dynamics-windows-x86_64.exe
            artifacts/sdof_dynamics-linux-x86_64
            artifacts/sdof_dynamics-macos-aarch64
            artifacts/sdof_dynamics-web.zip
          draft: false
          prerelease: false
