name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ── Native binaries (one job per platform) ────────────────────────────────
  build-native:
    name: Native — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: sdof_dynamics.exe
            asset_name: sdof_dynamics-windows-x86_64.exe
          - os: ubuntu-latest
            artifact: sdof_dynamics
            asset_name: sdof_dynamics-linux-x86_64
          - os: macos-latest
            artifact: sdof_dynamics
            asset_name: sdof_dynamics-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-native-

      - name: Build native binary
        run: cargo build --release --bin sdof_dynamics --features mathjax

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact }}

  # ── WebAssembly build ─────────────────────────────────────────────────────
  build-wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-wasm-

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --bin sdof_dynamics_web

      - name: Install wasm-bindgen-cli
        run: |
          curl -L -o wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.114/wasm-bindgen-0.2.114-x86_64-unknown-linux-musl.tar.gz
          tar -xzf wasm-bindgen.tar.gz
          mv wasm-bindgen-0.2.114-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/wasm-bindgen

      - name: Generate JS bindings and package
        run: |
          mkdir -p _web
          wasm-bindgen --target web --out-dir _web \
            target/wasm32-unknown-unknown/release/sdof_dynamics_web.wasm
          cp web/index.html _web/index.html
          cd _web && zip -r ../sdof_dynamics-web.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdof_dynamics-web
          path: sdof_dynamics-web.zip

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SDOF Dynamics Explorer ${{ github.ref_name }}"
          body: |
            ## SDOF Dynamics Explorer ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows (x86-64) | `sdof_dynamics-windows-x86_64.exe` — desktop app with LaTeX equations |
            | Linux (x86-64) | `sdof_dynamics-linux-x86_64` — desktop app with LaTeX equations |
            | macOS (Apple Silicon) | `sdof_dynamics-macos-aarch64` — desktop app with LaTeX equations |
            | Web (all platforms) | `sdof_dynamics-web.zip` — self-contained WASM bundle, serve with any HTTP server |

            ### Web Version
            The live web app is always available at the GitHub Pages URL (no download needed).

            ### Usage — Web bundle
            ```bash
            unzip sdof_dynamics-web.zip -d sdof_web
            cd sdof_web
            python3 -m http.server 8000
            # open http://localhost:8000
            ```

            ### Usage — Linux / macOS binary
            ```bash
            chmod +x sdof_dynamics-linux-x86_64
            ./sdof_dynamics-linux-x86_64
            ```
          files: |
            artifacts/sdof_dynamics-windows-x86_64.exe
            artifacts/sdof_dynamics-linux-x86_64
            artifacts/sdof_dynamics-macos-aarch64
            artifacts/sdof_dynamics-web.zip
          draft: false
          prerelease: false
